name: SunEcho Fleet Monitor Alerts

on:
  schedule:
    # Runs every 3 hours. (Adjust the cron schedule as needed)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub UI

jobs:
  check-fleet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install requests pandas pytz
          
      - name: Run Alert Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert_bot.py
